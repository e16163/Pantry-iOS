name = "pantry"
main = "src/index.js"
compatibility_date = "2026-11-01"

# PRIVACY.md is imported as text and served at /privacy.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Every dish picture is made once and kept here for all users.
[[kv_namespaces]]
binding = "PHOTOS"
id = "3c7a90fa08594d978d294f1047a2c805"

# GEMINI_KEY, GROQ_KEY and PIXABAY_KEY are secrets: npx wrangler secret put <NAME>

# Hands each Pixabay photo to one dish only; KV can't, since a claim reaches other servers late.
[[durable_objects.bindings]]
name = "CLAIMS"
class_name = "Claims"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Claims"]

# Requests a minute per phone. A recipe search is 1 request plus 3 photos; a scan is 1.
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PHOTO_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
